<svg viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="580" fill="#0f172a" rx="12"/>
  <text x="430" y="32" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Coroutine Dispatchers, Scopes, launch vs async &amp; Exceptions</text>

  <!-- ══ TOP: Main.immediate vs Main ══ -->
  <rect x="30" y="46" width="796" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="430" y="65" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">Main.immediate vs Main (Dispatchers.Main)</text>

  <rect x="46" y="72" width="370" height="64" rx="4" fill="#0f172a"/>
  <text x="60" y="87" fill="#86efac" font-size="9" font-weight="700">lifecycleScope.launch { }  (default = Main.immediate)</text>
  <text x="60" y="100" fill="#94a3b8" font-size="9">"Do it NOW" — does not post to the main thread queue.</text>
  <text x="60" y="113" fill="#94a3b8" font-size="9">Main thread runs the coroutine block immediately inline.</text>
  <text x="60" y="126" fill="#fcd34d" font-size="9">Output order: Function Start → Before Task → Function End → After Task</text>

  <rect x="424" y="72" width="386" height="64" rx="4" fill="#0f172a"/>
  <text x="438" y="87" fill="#fca5a5" font-size="9" font-weight="700">lifecycleScope.launch(Dispatchers.Main) { }  (queue)</text>
  <text x="438" y="100" fill="#94a3b8" font-size="9">"Post to queue" — equivalent to handler.post { }.</text>
  <text x="438" y="113" fill="#94a3b8" font-size="9">Main thread finishes current work first, then executes the block.</text>
  <text x="438" y="126" fill="#fcd34d" font-size="9">Output order: Function Start → Function End → Before Task → After Task</text>

  <!-- ══ MIDDLE: Scopes ══ -->
  <rect x="30" y="158" width="796" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="177" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">Coroutine Scopes — Lifecycle Awareness</text>

  <rect x="46" y="184" width="238" height="84" rx="4" fill="#0f172a"/>
  <text x="165" y="198" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">lifecycleScope ✅</text>
  <text x="165" y="211" text-anchor="middle" fill="#94a3b8" font-size="9">Tied to Activity/Fragment lifecycle.</text>
  <text x="165" y="224" text-anchor="middle" fill="#94a3b8" font-size="9">Activity destroyed → all coroutines</text>
  <text x="165" y="237" text-anchor="middle" fill="#94a3b8" font-size="9">cancelled automatically.</text>
  <text x="165" y="250" text-anchor="middle" fill="#4ade80" font-size="9">Safe for UI work.</text>
  <text x="165" y="263" text-anchor="middle" fill="#64748b" font-size="9">Default: Dispatchers.Main.immediate</text>

  <rect x="292" y="184" width="238" height="84" rx="4" fill="#0f172a"/>
  <text x="411" y="198" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">GlobalScope ⚠️</text>
  <text x="411" y="211" text-anchor="middle" fill="#94a3b8" font-size="9">Lives for app lifetime.</text>
  <text x="411" y="224" text-anchor="middle" fill="#94a3b8" font-size="9">Activity destroyed → coroutines</text>
  <text x="411" y="237" text-anchor="middle" fill="#94a3b8" font-size="9">keep running regardless.</text>
  <text x="411" y="250" text-anchor="middle" fill="#fca5a5" font-size="9">Rare use: save note after Activity closes.</text>
  <text x="411" y="263" text-anchor="middle" fill="#64748b" font-size="9">Default: Dispatchers.Default</text>

  <rect x="538" y="184" width="272" height="84" rx="4" fill="#0f172a"/>
  <text x="674" y="198" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">Custom CoroutineScope</text>
  <text x="674" y="211" text-anchor="middle" fill="#94a3b8" font-size="9">val myScope = CoroutineScope(Main.immediate)</text>
  <text x="674" y="224" text-anchor="middle" fill="#94a3b8" font-size="9">+ myScope.cancel() in onDestroy()</text>
  <text x="674" y="237" text-anchor="middle" fill="#94a3b8" font-size="9">= ~50% similar to lifecycleScope.</text>
  <text x="674" y="250" text-anchor="middle" fill="#fcd34d" font-size="9">Missing: SupervisorJob, error handling</text>
  <text x="674" y="263" text-anchor="middle" fill="#64748b" font-size="9">lifecycle callbacks etc.</text>

  <!-- ══ THIRD ROW: launch vs async vs withContext ══ -->
  <rect x="30" y="290" width="796" height="120" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="430" y="309" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">launch vs async vs withContext</text>

  <rect x="46" y="316" width="238" height="84" rx="4" fill="#0f172a"/>
  <text x="165" y="330" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">launch { }</text>
  <text x="165" y="343" text-anchor="middle" fill="#94a3b8" font-size="9">Starts a new coroutine.</text>
  <text x="165" y="356" text-anchor="middle" fill="#94a3b8" font-size="9">Returns a Job (not the result).</text>
  <text x="165" y="369" text-anchor="middle" fill="#94a3b8" font-size="9">Use when: you don't need the result.</text>
  <text x="165" y="382" text-anchor="middle" fill="#60a5fa" font-size="9">e.g. move a file, send analytics</text>
  <text x="165" y="395" text-anchor="middle" fill="#64748b" font-size="9">job.cancel() / job.join() available</text>

  <rect x="292" y="316" width="238" height="84" rx="4" fill="#0f172a"/>
  <text x="411" y="330" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">async { }</text>
  <text x="411" y="343" text-anchor="middle" fill="#94a3b8" font-size="9">Starts a new coroutine.</text>
  <text x="411" y="356" text-anchor="middle" fill="#94a3b8" font-size="9">Returns a Deferred (like a Future).</text>
  <text x="411" y="369" text-anchor="middle" fill="#94a3b8" font-size="9">Use when: you need the result.</text>
  <text x="411" y="382" text-anchor="middle" fill="#34d399" font-size="9">e.g. network call returning data</text>
  <text x="411" y="395" text-anchor="middle" fill="#64748b" font-size="9">val result = deferred.await()</text>

  <rect x="538" y="316" width="272" height="84" rx="4" fill="#0f172a"/>
  <text x="674" y="330" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">withContext(dispatcher) { }</text>
  <text x="674" y="343" text-anchor="middle" fill="#94a3b8" font-size="9">Does NOT start a new coroutine.</text>
  <text x="674" y="356" text-anchor="middle" fill="#94a3b8" font-size="9">Switches the current coroutine's thread.</text>
  <text x="674" y="369" text-anchor="middle" fill="#94a3b8" font-size="9">Returns the block's result directly.</text>
  <text x="674" y="382" text-anchor="middle" fill="#fcd34d" font-size="9">e.g. withContext(IO) { readFile() }</text>
  <text x="674" y="395" text-anchor="middle" fill="#64748b" font-size="9">Two in sequence = serial, not parallel</text>

  <!-- ══ BOTTOM: Exceptions ══ -->
  <rect x="30" y="422" width="796" height="140" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="441" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">Exception Handling</text>

  <rect x="46" y="448" width="238" height="104" rx="4" fill="#0f172a"/>
  <text x="165" y="462" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">launch — crashes immediately</text>
  <text x="60" y="477" fill="#94a3b8" font-size="9">lifecycleScope.launch {</text>
  <text x="72" y="490" fill="#94a3b8" font-size="9">throw Exception("oops")</text>
  <text x="60" y="503" fill="#94a3b8" font-size="9">}  // ❌ app crashes</text>
  <text x="60" y="516" fill="#86efac" font-size="9">Fix: wrap in CoroutineExceptionHandler</text>
  <text x="60" y="530" fill="#64748b" font-size="9">or try/catch inside the block</text>
  <text x="60" y="543" fill="#64748b" font-size="9">After exception: coroutine is dead</text>

  <rect x="292" y="448" width="238" height="104" rx="4" fill="#0f172a"/>
  <text x="411" y="462" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">async — holds exception until await()</text>
  <text x="306" y="477" fill="#94a3b8" font-size="9">val d = lifecycleScope.async {</text>
  <text x="318" y="490" fill="#94a3b8" font-size="9">throw Exception("oops")</text>
  <text x="306" y="503" fill="#94a3b8" font-size="9">} // exception stored in Deferred</text>
  <text x="306" y="516" fill="#94a3b8" font-size="9">try { d.await() }  // exception thrown here</text>
  <text x="306" y="529" fill="#86efac" font-size="9">catch (e: Exception) { handle it }</text>
  <text x="306" y="543" fill="#64748b" font-size="9">Without await: app never crashes</text>

  <rect x="538" y="448" width="272" height="104" rx="4" fill="#0f172a"/>
  <text x="674" y="462" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">CoroutineExceptionHandler</text>
  <text x="552" y="477" fill="#94a3b8" font-size="9">val handler = CoroutineExceptionHandler { _, e -></text>
  <text x="552" y="490" fill="#94a3b8" font-size="9">  Log.d(TAG, "caught: $e")</text>
  <text x="552" y="503" fill="#94a3b8" font-size="9">}</text>
  <text x="552" y="516" fill="#94a3b8" font-size="9">lifecycleScope.launch(handler) {</text>
  <text x="552" y="529" fill="#94a3b8" font-size="9">  throw Exception("oops")  // caught, no crash</text>
  <text x="552" y="542" fill="#94a3b8" font-size="9">}  // SupervisorJob: other coroutines survive</text>
</svg>
