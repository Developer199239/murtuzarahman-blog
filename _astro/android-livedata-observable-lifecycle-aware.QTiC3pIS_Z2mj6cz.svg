<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="540" fill="#0f172a" rx="12"/>
  <text x="430" y="30" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">LiveData — Observable, Lifecycle-Aware, and the Two-Variable Pattern</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- ══ TOP LEFT: Observable ══ -->
  <rect x="20" y="44" width="390" height="174" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="215" y="64" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Property 1 — Observable Data Holder</text>

  <rect x="36" y="72" width="174" height="60" rx="4" fill="#450a0a"/>
  <text x="123" y="88" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">Normal variable</text>
  <text x="123" y="103" text-anchor="middle" fill="#94a3b8" font-size="8">var count: Int = 0</text>
  <text x="123" y="116" text-anchor="middle" fill="#94a3b8" font-size="8">count = 10</text>
  <text x="123" y="128" text-anchor="middle" fill="#f87171" font-size="8">→ nobody is notified ✗</text>

  <rect x="220" y="72" width="174" height="60" rx="4" fill="#14532d"/>
  <text x="307" y="88" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">LiveData</text>
  <text x="307" y="103" text-anchor="middle" fill="#94a3b8" font-size="8">val count = MutableLiveData(0)</text>
  <text x="307" y="116" text-anchor="middle" fill="#94a3b8" font-size="8">count.setValue(10)</text>
  <text x="307" y="128" text-anchor="middle" fill="#86efac" font-size="8">→ all observers notified ✅</text>

  <rect x="36" y="140" width="358" height="68" rx="4" fill="#0f172a"/>
  <text x="215" y="157" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="600">Why LiveData is observable but Int is not</text>
  <text x="50" y="173" fill="#94a3b8" font-size="8">Primitive types have no setter logic — direct assignment bypasses any notification.</text>
  <text x="50" y="187" fill="#94a3b8" font-size="8">LiveData forces updates through setValue() / postValue(), which intercept</text>
  <text x="50" y="200" fill="#94a3b8" font-size="8">the change and iterate over registered observers to notify each one.</text>

  <!-- ══ TOP RIGHT: Lifecycle-Aware ══ -->
  <rect x="450" y="44" width="390" height="174" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="645" y="64" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">Property 2 — Lifecycle-Aware</text>

  <!-- Lifecycle state bars -->
  <text x="466" y="82" fill="#64748b" font-size="8" font-weight="600">Activity lifecycle state:</text>
  <rect x="466" y="88" width="60" height="18" rx="3" fill="#1e3a5f"/>
  <text x="496" y="101" text-anchor="middle" fill="#60a5fa" font-size="8">CREATED</text>
  <rect x="534" y="88" width="60" height="18" rx="3" fill="#2d1f3a"/>
  <text x="564" y="101" text-anchor="middle" fill="#c084fc" font-size="8">STARTED</text>
  <rect x="602" y="88" width="60" height="18" rx="3" fill="#14532d"/>
  <text x="632" y="101" text-anchor="middle" fill="#86efac" font-size="8">RESUMED</text>
  <rect x="670" y="88" width="60" height="18" rx="3" fill="#2d1a00"/>
  <text x="700" y="101" text-anchor="middle" fill="#fcd34d" font-size="8">STOPPED</text>
  <rect x="738" y="88" width="90" height="18" rx="3" fill="#450a0a"/>
  <text x="783" y="101" text-anchor="middle" fill="#f87171" font-size="8">DESTROYED</text>

  <text x="466" y="122" fill="#64748b" font-size="8" font-weight="600">LiveData delivers updates:</text>
  <rect x="534" y="110" width="60" height="18" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="564" y="123" text-anchor="middle" fill="#86efac" font-size="8">✅ active</text>
  <rect x="602" y="110" width="60" height="18" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="632" y="123" text-anchor="middle" fill="#86efac" font-size="8">✅ active</text>
  <rect x="670" y="110" width="60" height="18" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="700" y="123" text-anchor="middle" fill="#f87171" font-size="8">✗ paused</text>
  <rect x="738" y="110" width="90" height="18" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="783" y="123" text-anchor="middle" fill="#f87171" font-size="8">✗ stopped</text>

  <rect x="466" y="136" width="358" height="72" rx="4" fill="#0f172a"/>
  <text x="645" y="153" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="600">Why this matters</text>
  <text x="480" y="169" fill="#94a3b8" font-size="8">If LiveData updates the UI while the Activity is in STOPPED or DESTROYED,</text>
  <text x="480" y="183" fill="#94a3b8" font-size="8">the app crashes. LiveData checks the observer's lifecycle state before</text>
  <text x="480" y="197" fill="#94a3b8" font-size="8">delivering each update — no manual unregistering needed.</text>

  <!-- ══ MIDDLE: setValue vs postValue ══ -->
  <rect x="20" y="230" width="820" height="76" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="250" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">setValue vs postValue</text>

  <rect x="36" y="258" width="394" height="40" rx="4" fill="#0f172a"/>
  <text x="233" y="273" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">setValue(value)  — main thread only</text>
  <text x="233" y="288" text-anchor="middle" fill="#94a3b8" font-size="8">Call from the main/UI thread. Synchronous — observers notified immediately.</text>

  <rect x="450" y="258" width="374" height="40" rx="4" fill="#0f172a"/>
  <text x="637" y="273" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="700">postValue(value)  — any thread</text>
  <text x="637" y="288" text-anchor="middle" fill="#94a3b8" font-size="8">Safe from background threads. Posts to main thread internally. Use only when needed.</text>

  <!-- ══ BOTTOM: Two-variable pattern ══ -->
  <rect x="20" y="318" width="820" height="204" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="338" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">The Two-Variable Pattern — Private Mutable + Public Immutable</text>

  <rect x="36" y="346" width="390" height="114" rx="4" fill="#0f172a"/>
  <text x="231" y="362" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">In the ViewModel</text>
  <text x="50" y="378" fill="#94a3b8" font-size="9">class MainViewModel : ViewModel() {</text>
  <text x="50" y="393" fill="#c084fc" font-size="9">    private val _counter = MutableLiveData(0)  // write access</text>
  <text x="50" y="408" fill="#60a5fa" font-size="9">    val counter: LiveData&lt;Int&gt; = _counter       // read-only</text>
  <text x="50" y="423" fill="#94a3b8" font-size="9"></text>
  <text x="50" y="438" fill="#94a3b8" font-size="9">    fun increaseCounter() {</text>
  <text x="50" y="451" fill="#94a3b8" font-size="9">        _counter.value = _counter.value?.plus(1)  // ViewModel updates</text>

  <rect x="446" y="346" width="378" height="114" rx="4" fill="#0f172a"/>
  <text x="635" y="362" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">In the Activity (observer)</text>
  <text x="460" y="378" fill="#94a3b8" font-size="9">viewModel.counter.observe(this) { value -&gt;</text>
  <text x="460" y="393" fill="#94a3b8" font-size="9">    binding.textView.text = value.toString()</text>
  <text x="460" y="408" fill="#94a3b8" font-size="9">}</text>
  <text x="460" y="426" fill="#64748b" font-size="8">Activity reads counter (public LiveData)</text>
  <text x="460" y="440" fill="#64748b" font-size="8">Activity cannot call _counter.value = X  (private)</text>
  <text x="460" y="454" fill="#86efac" font-size="8">Only ViewModel can mutate the state ✅</text>

  <rect x="36" y="468" width="788" height="44" rx="4" fill="#14532d"/>
  <text x="430" y="484" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">MVVM Principle: ViewModel is the only class allowed to update UI state</text>
  <text x="430" y="501" text-anchor="middle" fill="#94a3b8" font-size="8">MutableLiveData = private + writable (ViewModel owns it).  LiveData = public + read-only (Activity/Fragment observe it).</text>
</svg>
