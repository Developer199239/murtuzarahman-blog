<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="540" fill="#0f172a" rx="12"/>
  <text x="430" y="32" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Kotlin Flow Internals: Upstream, Downstream &amp; Operator Chain</text>

  <!-- ══ LEFT: Building blocks ══ -->
  <rect x="30" y="48" width="250" height="220" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="155" y="68" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Flow Building Blocks</text>

  <rect x="46" y="76" width="218" height="42" rx="4" fill="#0f172a"/>
  <text x="60" y="91" fill="#64748b" font-size="9" font-weight="600">Function (SAM interface):</text>
  <text x="60" y="104" fill="#94a3b8" font-size="9">fun interface Function {</text>
  <text x="72" y="115" fill="#94a3b8" font-size="9">  fun apply(value: String): String</text>

  <rect x="46" y="122" width="218" height="42" rx="4" fill="#0f172a"/>
  <text x="60" y="137" fill="#64748b" font-size="9" font-weight="600">Collector (SAM interface):</text>
  <text x="60" y="150" fill="#94a3b8" font-size="9">fun interface Collector {</text>
  <text x="72" y="161" fill="#94a3b8" font-size="9">  fun collect(value: String)</text>

  <rect x="46" y="168" width="218" height="90" rx="4" fill="#0f172a"/>
  <text x="60" y="183" fill="#64748b" font-size="9" font-weight="600">Flow class:</text>
  <text x="60" y="196" fill="#94a3b8" font-size="9">class Flow(private var value: String) {</text>
  <text x="60" y="208" fill="#94a3b8" font-size="9">  fun map(fn: Function): Flow {</text>
  <text x="60" y="220" fill="#94a3b8" font-size="9">    value = fn.apply(value); return this</text>
  <text x="60" y="232" fill="#94a3b8" font-size="9">  }   // returns Flow → enables chaining</text>
  <text x="60" y="244" fill="#94a3b8" font-size="9">  fun collect(c: Collector) { c.collect(value) }</text>
  <text x="60" y="256" fill="#94a3b8" font-size="9">}    // collect = terminal operator</text>

  <!-- ══ RIGHT TOP: Upstream/Downstream ══ -->
  <rect x="298" y="48" width="532" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="564" y="68" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">Upstream → Downstream Flow</text>

  <!-- Flow chain visual -->
  <rect x="314" y="78" width="500" height="32" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="414" y="90" fill="#64748b" font-size="9">UPSTREAM ↑</text>
  <text x="564" y="93" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="700">Flow("Amit")  ← source value</text>

  <line x1="564" y1="110" x2="564" y2="124" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="314" y="124" width="500" height="32" rx="5" fill="#2d1f3a" stroke="#a855f7" stroke-width="1"/>
  <text x="564" y="144" text-anchor="middle" fill="#c084fc" font-size="10">.map { firstName → "Amit Shekhar" }  ← transform</text>

  <line x1="564" y1="156" x2="564" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="314" y="170" width="500" height="32" rx="5" fill="#2d1f3a" stroke="#a855f7" stroke-width="1"/>
  <text x="564" y="190" text-anchor="middle" fill="#c084fc" font-size="10">.map { fullName → "amitshekhar" }  ← chain operator</text>

  <line x1="564" y1="202" x2="564" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="314" y="216" width="500" height="32" rx="5" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="414" y="228" fill="#64748b" font-size="9">DOWNSTREAM ↓</text>
  <text x="564" y="236" text-anchor="middle" fill="#86efac" font-size="10">.collect { Log.d(TAG, it) }  ← terminal operator</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- ══ MIDDLE: SAM + Cold Flow ══ -->
  <rect x="30" y="282" width="390" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="225" y="301" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">SAM Interface — Why Lambdas Work</text>

  <rect x="46" y="308" width="358" height="52" rx="4" fill="#0f172a"/>
  <text x="225" y="322" text-anchor="middle" fill="#94a3b8" font-size="9">A SAM (Single Abstract Method) interface has exactly one method.</text>
  <text x="225" y="336" text-anchor="middle" fill="#94a3b8" font-size="9">Kotlin allows implementing it with a single lambda — no boilerplate.</text>
  <text x="225" y="350" text-anchor="middle" fill="#64748b" font-size="9">Two methods → not SAM → must use full anonymous class.</text>

  <rect x="46" y="364" width="170" height="60" rx="4" fill="#450a0a"/>
  <text x="131" y="378" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">Without SAM (verbose)</text>
  <text x="60" y="393" fill="#94a3b8" font-size="9">.collect(object : Collector {</text>
  <text x="60" y="406" fill="#94a3b8" font-size="9">  override fun collect(v: String) {</text>
  <text x="60" y="419" fill="#94a3b8" font-size="9">    Log.d(TAG, v) } })</text>

  <rect x="224" y="364" width="180" height="60" rx="4" fill="#14532d"/>
  <text x="314" y="378" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">With SAM (clean)</text>
  <text x="238" y="393" fill="#4ade80" font-size="9">.collect {</text>
  <text x="238" y="406" fill="#4ade80" font-size="9">  Log.d(TAG, it)</text>
  <text x="238" y="419" fill="#4ade80" font-size="9">}</text>

  <!-- ══ MIDDLE-RIGHT: Emissions + Cold ══ -->
  <rect x="440" y="282" width="390" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="635" y="301" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Cold Flow + Single vs Multiple Emissions</text>

  <rect x="456" y="308" width="358" height="40" rx="4" fill="#450a0a"/>
  <text x="635" y="322" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">Cold Flow — nothing runs until .collect is called</text>
  <text x="635" y="336" text-anchor="middle" fill="#94a3b8" font-size="9">If you build a Flow but never call .collect, zero code executes.</text>

  <rect x="456" y="352" width="170" height="72" rx="4" fill="#0f172a"/>
  <text x="541" y="367" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">Single emission</text>
  <text x="541" y="380" text-anchor="middle" fill="#94a3b8" font-size="9">Network call → emit(list)</text>
  <text x="541" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">Emits once — even if</text>
  <text x="541" y="406" text-anchor="middle" fill="#94a3b8" font-size="9">the list has 100 users</text>
  <text x="541" y="419" text-anchor="middle" fill="#64748b" font-size="9">list = 1 value</text>

  <rect x="634" y="352" width="178" height="72" rx="4" fill="#0f172a"/>
  <text x="723" y="367" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">Multiple emissions</text>
  <text x="723" y="380" text-anchor="middle" fill="#94a3b8" font-size="9">WebSocket → emit each</text>
  <text x="723" y="393" text-anchor="middle" fill="#94a3b8" font-size="9">message as it arrives</text>
  <text x="723" y="406" text-anchor="middle" fill="#94a3b8" font-size="9">msg1, msg2, msg3…</text>
  <text x="723" y="419" text-anchor="middle" fill="#64748b" font-size="9">each = 1 value</text>

  <!-- ══ BOTTOM: Language translation example ══ -->
  <rect x="30" y="446" width="796" height="80" rx="8" fill="#1e293b"/>
  <text x="430" y="466" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">Example: Chain Operators Like Translation Steps</text>

  <rect x="46" y="474" width="130" height="42" rx="5" fill="#1e3a5f"/>
  <text x="111" y="489" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="700">English data</text>
  <text x="111" y="503" text-anchor="middle" fill="#64748b" font-size="9">upstream source</text>

  <text x="192" y="497" text-anchor="middle" fill="#475569" font-size="14">→</text>

  <rect x="202" y="474" width="170" height="42" rx="5" fill="#2d1f3a"/>
  <text x="287" y="489" text-anchor="middle" fill="#c084fc" font-size="10">.map { English → Sanskrit }</text>
  <text x="287" y="503" text-anchor="middle" fill="#64748b" font-size="9">no direct English→Hindi translator</text>

  <text x="388" y="497" text-anchor="middle" fill="#475569" font-size="14">→</text>

  <rect x="398" y="474" width="170" height="42" rx="5" fill="#2d1f3a"/>
  <text x="483" y="489" text-anchor="middle" fill="#c084fc" font-size="10">.map { Sanskrit → Hindi }</text>
  <text x="483" y="503" text-anchor="middle" fill="#64748b" font-size="9">chained operator</text>

  <text x="584" y="497" text-anchor="middle" fill="#475569" font-size="14">→</text>

  <rect x="594" y="474" width="210" height="42" rx="5" fill="#14532d"/>
  <text x="699" y="489" text-anchor="middle" fill="#86efac" font-size="10">.collect { display Hindi data }</text>
  <text x="699" y="503" text-anchor="middle" fill="#64748b" font-size="9">terminal operator</text>
</svg>
