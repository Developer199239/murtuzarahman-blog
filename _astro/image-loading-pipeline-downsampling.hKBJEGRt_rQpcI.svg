<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="520" fill="#0f172a" rx="12"/>
  <text x="430" y="34" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Android Image Loading: Pipeline &amp; Downsampling</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- ══ TOP: Loading Pipeline ══ -->
  <text x="430" y="58" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Image Loading Pipeline</text>

  <!-- Step 1: URL -->
  <rect x="30" y="68" width="130" height="52" rx="7" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">① URL</text>
  <text x="95" y="107" text-anchor="middle" fill="#94a3b8" font-size="9">server/cdn/storage</text>

  <line x1="160" y1="94" x2="192" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 2: Download -->
  <rect x="192" y="68" width="150" height="52" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="267" y="87" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">② Download</text>
  <text x="267" y="101" text-anchor="middle" fill="#94a3b8" font-size="9">bg thread · ~5 s</text>
  <text x="267" y="114" text-anchor="middle" fill="#64748b" font-size="8">file saved to disk/sd card</text>

  <line x1="342" y1="94" x2="374" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 3: Decode -->
  <rect x="374" y="68" width="150" height="52" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="449" y="87" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">③ Decode</text>
  <text x="449" y="101" text-anchor="middle" fill="#94a3b8" font-size="9">bg thread · ~2 s</text>
  <text x="449" y="114" text-anchor="middle" fill="#64748b" font-size="8">file → Bitmap (2D pixel array)</text>

  <line x1="524" y1="94" x2="556" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 4: Display -->
  <rect x="556" y="68" width="150" height="52" rx="7" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="631" y="87" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">④ Display</text>
  <text x="631" y="101" text-anchor="middle" fill="#94a3b8" font-size="9">main thread · bitmap set</text>
  <text x="631" y="114" text-anchor="middle" fill="#64748b" font-size="8">imageView.setImageBitmap()</text>

  <!-- Total time badge -->
  <rect x="720" y="74" width="126" height="40" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="783" y="91" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Total: ~7 seconds</text>
  <text x="783" y="106" text-anchor="middle" fill="#64748b" font-size="9">without any optimisation</text>

  <!-- ══ PROBLEMS bar ══ -->
  <rect x="30" y="134" width="796" height="48" rx="7" fill="#1e293b"/>
  <text x="430" y="152" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">3 Problems Without an Image Library</text>
  <text x="220" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">① OOM — full-size bitmap in RAM</text>
  <text x="430" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">② Slow — download + decode every time</text>
  <text x="660" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">③ UI freeze — work on main thread</text>

  <!-- ══ DOWNSAMPLING section ══ -->
  <text x="430" y="206" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Downsampling: Match Image Size to ImageView Size</text>

  <!-- Server image -->
  <rect x="30" y="218" width="200" height="170" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="238" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">Server Image</text>
  <!-- pixel grid 5x5 representing 5000x5000 -->
  <rect x="50" y="248" width="160" height="120" rx="4" fill="#0f172a"/>
  <text x="130" y="270" text-anchor="middle" fill="#ef4444" font-size="28" font-weight="900">5000</text>
  <text x="130" y="296" text-anchor="middle" fill="#64748b" font-size="11">×</text>
  <text x="130" y="320" text-anchor="middle" fill="#ef4444" font-size="28" font-weight="900">5000</text>
  <text x="130" y="344" text-anchor="middle" fill="#94a3b8" font-size="9">px — file ~5 MB</text>
  <text x="130" y="378" text-anchor="middle" fill="#f87171" font-size="10">Loads into RAM as 5 MB bitmap</text>

  <!-- Arrow with label -->
  <line x1="230" y1="303" x2="284" y2="303" stroke="#22c55e" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="228" y="280" width="62" height="32" rx="4" fill="#14532d"/>
  <text x="259" y="294" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">Down-</text>
  <text x="259" y="306" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">sample</text>

  <!-- Device image -->
  <rect x="284" y="218" width="200" height="170" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="384" y="238" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">After Downsampling</text>
  <rect x="304" y="248" width="160" height="120" rx="4" fill="#0f172a"/>
  <text x="384" y="270" text-anchor="middle" fill="#22c55e" font-size="28" font-weight="900">500</text>
  <text x="384" y="296" text-anchor="middle" fill="#64748b" font-size="11">×</text>
  <text x="384" y="320" text-anchor="middle" fill="#22c55e" font-size="28" font-weight="900">500</text>
  <text x="384" y="344" text-anchor="middle" fill="#94a3b8" font-size="9">px — file ~0.5 MB</text>
  <text x="384" y="378" text-anchor="middle" fill="#86efac" font-size="10">Matches ImageView exactly ✅</text>

  <!-- BitmapFactory code hint -->
  <rect x="500" y="218" width="326" height="170" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="663" y="238" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">BitmapFactory.Options</text>
  <rect x="516" y="246" width="294" height="120" rx="5" fill="#0f172a"/>
  <text x="520" y="263" fill="#94a3b8" font-size="10">val options = BitmapFactory.Options()</text>
  <text x="520" y="280" fill="#94a3b8" font-size="10">options.inJustDecodeBounds = true</text>
  <text x="520" y="297" fill="#94a3b8" font-size="10">BitmapFactory.decodeFile(path, options)</text>
  <text x="520" y="314" fill="#fcd34d" font-size="10">// measure original size first</text>
  <text x="520" y="331" fill="#94a3b8" font-size="10">options.inSampleSize = 10  // 1/10 scale</text>
  <text x="520" y="348" fill="#94a3b8" font-size="10">options.inJustDecodeBounds = false</text>
  <text x="520" y="365" fill="#86efac" font-size="10">BitmapFactory.decodeFile(path, options)</text>
  <text x="663" y="378" text-anchor="middle" fill="#64748b" font-size="9">inSampleSize=10 → 1/10 width &amp; height → 1/100 memory</text>

  <!-- ══ Bottom: bandwidth note ══ -->
  <rect x="30" y="402" width="796" height="96" rx="7" fill="#1e293b"/>
  <text x="430" y="421" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">Bandwidth Problem: Client-Side vs Server-Side Downsampling</text>

  <!-- client side -->
  <rect x="44" y="430" width="360" height="56" rx="5" fill="#450a0a"/>
  <text x="224" y="447" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Client-Side (most companies) ❌</text>
  <text x="224" y="462" text-anchor="middle" fill="#94a3b8" font-size="9">Server sends 5 MB → device downloads 5 MB → then downsamples to 0.5 MB</text>
  <text x="224" y="477" text-anchor="middle" fill="#f87171" font-size="9">4.5 MB of bandwidth wasted per image</text>

  <!-- server side / akamai -->
  <rect x="422" y="430" width="390" height="56" rx="5" fill="#14532d"/>
  <text x="617" y="447" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Server-Side CDN (Akamai) ✅</text>
  <text x="617" y="462" text-anchor="middle" fill="#94a3b8" font-size="9">Client requests 500×500 → CDN checks cache → serves pre-scaled image</text>
  <text x="617" y="477" text-anchor="middle" fill="#4ade80" font-size="9">User downloads only 0.5 MB — expensive, used by large companies only</text>
</svg>
