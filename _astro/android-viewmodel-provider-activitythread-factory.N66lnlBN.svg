<svg viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="580" fill="#0f172a" rx="12"/>
  <text x="430" y="30" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">ViewModel Internal Architecture — ViewModelProvider, ActivityThread, and Factory</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- ══ TOP: Full chain ══ -->
  <rect x="20" y="44" width="820" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="430" y="64" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">The Full Internal Chain</text>
  <text x="430" y="82" text-anchor="middle" fill="#94a3b8" font-size="9">Activity → ViewModelProvider → ComponentActivity → NonConfigurationInstance → ViewModelStore → ViewModel</text>
  <text x="430" y="94" text-anchor="middle" fill="#64748b" font-size="8">ActivityThread (longer lifecycle) holds NonConfigurationInstance during config changes and reassigns it to the new Activity instance</text>

  <!-- ══ COMPONENT BOXES ══ -->
  <!-- Activity -->
  <rect x="20" y="112" width="130" height="56" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="133" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="700">Activity</text>
  <text x="85" y="148" text-anchor="middle" fill="#94a3b8" font-size="8">Owner</text>
  <text x="85" y="161" text-anchor="middle" fill="#64748b" font-size="8">calls ViewModelProvider</text>

  <line x1="150" y1="140" x2="168" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ViewModelProvider -->
  <rect x="170" y="112" width="150" height="56" rx="6" fill="#2d1f3a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="245" y="133" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="700">ViewModelProvider</text>
  <text x="245" y="148" text-anchor="middle" fill="#94a3b8" font-size="8">ViewModelProvider(this)</text>
  <text x="245" y="161" text-anchor="middle" fill="#64748b" font-size="8">[MainViewModel::class.java]</text>

  <line x1="320" y1="140" x2="338" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ComponentActivity -->
  <rect x="340" y="112" width="155" height="56" rx="6" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="417" y="133" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">ComponentActivity</text>
  <text x="417" y="148" text-anchor="middle" fill="#94a3b8" font-size="8">extends Activity</text>
  <text x="417" y="161" text-anchor="middle" fill="#64748b" font-size="8">holds NonConfigurationInstance</text>

  <line x1="495" y1="140" x2="513" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- NonConfigurationInstance -->
  <rect x="515" y="112" width="175" height="56" rx="6" fill="#2d1a00" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="602" y="130" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">NonConfigurationInstance</text>
  <text x="602" y="145" text-anchor="middle" fill="#94a3b8" font-size="8">static class inside ComponentActivity</text>
  <text x="602" y="158" text-anchor="middle" fill="#94a3b8" font-size="8">holds custom object + ViewModelStore</text>
  <text x="602" y="168" text-anchor="middle" fill="#64748b" font-size="8">(before ViewModel: only custom object existed)</text>

  <line x1="690" y1="140" x2="708" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ViewModelStore -->
  <rect x="710" y="112" width="150" height="56" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="785" y="133" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">ViewModelStore</text>
  <text x="785" y="148" text-anchor="middle" fill="#94a3b8" font-size="8">HashMap&lt;String, ViewModel&gt;</text>
  <text x="785" y="161" text-anchor="middle" fill="#64748b" font-size="8">same idea as our prototype</text>

  <!-- ActivityThread (below the chain) -->
  <rect x="340" y="184" width="155" height="44" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="417" y="202" text-anchor="middle" fill="#fb7185" font-size="9" font-weight="700">ActivityThread</text>
  <text x="417" y="215" text-anchor="middle" fill="#94a3b8" font-size="8">created before Application</text>
  <text x="417" y="225" text-anchor="middle" fill="#64748b" font-size="8">NOT a Java thread — activity manager class</text>

  <!-- Arrow: ActivityThread ↔ NonConfigurationInstance during config change -->
  <line x1="495" y1="206" x2="513" y2="156" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="510" y="188" fill="#fb7185" font-size="8">holds during</text>
  <text x="510" y="198" fill="#fb7185" font-size="8">config change</text>

  <!-- ══ THREE SCENARIOS ══ -->
  <!-- Scenario 1: First Launch -->
  <rect x="20" y="244" width="262" height="148" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="151" y="264" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="700">Scenario 1 — First Launch</text>
  <text x="40" y="280" fill="#94a3b8" font-size="8">1. Activity calls ViewModelProvider</text>
  <text x="40" y="294" fill="#94a3b8" font-size="8">2. Provider checks ViewModelStore → empty</text>
  <text x="40" y="308" fill="#94a3b8" font-size="8">3. Provider creates new ViewModel</text>
  <text x="40" y="322" fill="#94a3b8" font-size="8">   (via Factory or reflection)</text>
  <text x="40" y="336" fill="#94a3b8" font-size="8">4. ViewModel stored in ViewModelStore</text>
  <text x="40" y="350" fill="#94a3b8" font-size="8">5. Stored in NonConfigurationInstance</text>
  <text x="40" y="364" fill="#94a3b8" font-size="8">6. ViewModel returned to Activity ✅</text>
  <text x="40" y="382" fill="#86efac" font-size="8" font-weight="700">Result: fresh ViewModel created and stored</text>

  <!-- Scenario 2: Config Change -->
  <rect x="298" y="244" width="262" height="148" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="429" y="264" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="700">Scenario 2 — Config Change (Rotation)</text>
  <text x="318" y="280" fill="#94a3b8" font-size="8">1. Activity destroyed (config change)</text>
  <text x="318" y="294" fill="#94a3b8" font-size="8">2. ActivityThread holds NonConfigInstance</text>
  <text x="318" y="308" fill="#94a3b8" font-size="8">3. Activity recreated — onCreate() runs</text>
  <text x="318" y="322" fill="#94a3b8" font-size="8">4. ActivityThread reassigns same</text>
  <text x="318" y="336" fill="#94a3b8" font-size="8">   NonConfigInstance to new Activity</text>
  <text x="318" y="350" fill="#94a3b8" font-size="8">5. ViewModelStore already has ViewModel</text>
  <text x="318" y="364" fill="#94a3b8" font-size="8">6. Existing ViewModel returned ✅</text>
  <text x="318" y="382" fill="#fcd34d" font-size="8" font-weight="700">Result: same ViewModel instance — data preserved</text>

  <!-- Scenario 3: Permanent Destroy -->
  <rect x="576" y="244" width="264" height="148" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="708" y="264" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">Scenario 3 — Permanent Destroy</text>
  <text x="596" y="280" fill="#94a3b8" font-size="8">1. Activity destroyed (user presses back /</text>
  <text x="596" y="294" fill="#94a3b8" font-size="8">   finish() called — NOT a config change)</text>
  <text x="596" y="308" fill="#94a3b8" font-size="8">2. ActivityThread does NOT reassign</text>
  <text x="596" y="322" fill="#94a3b8" font-size="8">   NonConfigInstance</text>
  <text x="596" y="336" fill="#94a3b8" font-size="8">3. onDestroy() calls viewModelStore.clear()</text>
  <text x="596" y="350" fill="#94a3b8" font-size="8">4. ViewModel.onCleared() invoked</text>
  <text x="596" y="364" fill="#94a3b8" font-size="8">5. ViewModel removed from memory</text>
  <text x="596" y="382" fill="#fca5a5" font-size="8" font-weight="700">Result: ViewModel destroyed — no memory leak</text>

  <!-- ══ FACTORY ══ -->
  <rect x="20" y="408" width="820" height="152" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="430" y="428" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Factory — When and Why</text>

  <rect x="36" y="436" width="390" height="114" rx="4" fill="#0f172a"/>
  <text x="231" y="453" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="700">No Factory Needed (0-parameter ViewModel)</text>
  <text x="50" y="470" fill="#94a3b8" font-size="8">class MyViewModel : ViewModel()  // no constructor args</text>
  <text x="50" y="484" fill="#94a3b8" font-size="8">ViewModelProvider(this)[MyViewModel::class.java]</text>
  <text x="50" y="498" fill="#64748b" font-size="8">Default factory used internally — creates via reflection:</text>
  <text x="50" y="512" fill="#94a3b8" font-size="8">modelClass.getDeclaredConstructor().newInstance()</text>
  <text x="50" y="526" fill="#64748b" font-size="8">Reflection is slower than direct instantiation but used once at creation time.</text>
  <text x="50" y="540" fill="#86efac" font-size="8">✅ Android handles this automatically — no extra code needed</text>

  <rect x="444" y="436" width="390" height="114" rx="4" fill="#0f172a"/>
  <text x="639" y="453" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">Factory Required (parameterized ViewModel)</text>
  <text x="458" y="470" fill="#94a3b8" font-size="8">class MyViewModel(val repo: Repository) : ViewModel()</text>
  <text x="458" y="484" fill="#64748b" font-size="8">Reflection cannot pass constructor args — no default factory</text>
  <text x="458" y="498" fill="#94a3b8" font-size="8">class MyFactory(val repo: Repository) : ViewModelProvider.Factory {</text>
  <text x="458" y="512" fill="#94a3b8" font-size="8">    override fun &lt;T : ViewModel&gt; create(c: Class&lt;T&gt;): T =</text>
  <text x="458" y="526" fill="#94a3b8" font-size="8">        MyViewModel(repo) as T</text>
  <text x="458" y="540" fill="#fcd34d" font-size="8">Rule: 0 params → no factory. 1+ params → custom factory required.</text>
</svg>
