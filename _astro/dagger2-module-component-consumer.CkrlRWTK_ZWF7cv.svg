<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#0f172a" rx="12"/>
  <text x="430" y="34" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Dagger 2: Module → Component → Consumer</text>

  <defs>
    <marker id="darr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="darr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- ══ MODULE column ══ -->
  <rect x="30" y="54" width="230" height="340" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="30" y="54" width="230" height="32" rx="8" fill="#92400e"/>
  <rect x="30" y="70"  width="230" height="16" fill="#92400e"/>
  <text x="145" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">@Module</text>
  <text x="145" y="90" text-anchor="middle" fill="#fde68a" font-size="10">Dependency Provider</text>

  <!-- provides items -->
  <rect x="46" y="100" width="198" height="50" rx="5" fill="#0f172a"/>
  <text x="145" y="118" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">@Provides @Singleton</text>
  <text x="145" y="132" text-anchor="middle" fill="#fcd34d" font-size="11">provideHttpClient()</text>
  <text x="145" y="145" text-anchor="middle" fill="#94a3b8" font-size="9">→ HttpClient</text>

  <rect x="46" y="158" width="198" height="50" rx="5" fill="#0f172a"/>
  <text x="145" y="176" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">@Provides @Singleton</text>
  <text x="145" y="190" text-anchor="middle" fill="#fcd34d" font-size="11">provideDatabase()</text>
  <text x="145" y="203" text-anchor="middle" fill="#94a3b8" font-size="9">→ DatabaseHelper</text>

  <rect x="46" y="216" width="198" height="50" rx="5" fill="#0f172a"/>
  <text x="145" y="234" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">@Provides</text>
  <text x="145" y="248" text-anchor="middle" fill="#fcd34d" font-size="11">provideStorage()</text>
  <text x="145" y="261" text-anchor="middle" fill="#94a3b8" font-size="9">→ FileStorageService</text>

  <!-- qualifier example -->
  <rect x="46" y="274" width="198" height="62" rx="5" fill="#1c1708"/>
  <text x="145" y="291" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">@Qualifier example</text>
  <text x="145" y="306" text-anchor="middle" fill="#fcd34d" font-size="10">@ApiUrl → "https://api.x.com"</text>
  <text x="145" y="320" text-anchor="middle" fill="#fcd34d" font-size="10">@DatabaseName → "app_db"</text>
  <text x="145" y="334" text-anchor="middle" fill="#94a3b8" font-size="9">Same type (String), different identity</text>

  <!-- ══ Arrows Module → Component ══ -->
  <line x1="260" y1="224" x2="310" y2="224" stroke="#a855f7" stroke-width="2" marker-end="url(#darr2)"/>
  <text x="285" y="218" text-anchor="middle" fill="#a855f7" font-size="9">provides</text>

  <!-- ══ COMPONENT column ══ -->
  <rect x="310" y="54" width="240" height="340" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <rect x="310" y="54" width="240" height="32" rx="8" fill="#581c87"/>
  <rect x="310" y="70"  width="240" height="16" fill="#581c87"/>
  <text x="430" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">@Component</text>
  <text x="430" y="90" text-anchor="middle" fill="#e9d5ff" font-size="10">Bridge — Module ↔ Consumer</text>

  <rect x="326" y="100" width="208" height="44" rx="5" fill="#0f172a"/>
  <text x="430" y="118" text-anchor="middle" fill="#c084fc" font-size="10">@Singleton</text>
  <text x="430" y="132" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">interface ApplicationComponent</text>
  <text x="430" y="144" text-anchor="middle" fill="#94a3b8" font-size="9">modules = [ApplicationModule::class]</text>

  <!-- scope lifecycle box -->
  <rect x="326" y="152" width="208" height="80" rx="5" fill="#0f172a"/>
  <text x="430" y="170" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="600">Scope = Object Lifetime</text>
  <text x="430" y="186" text-anchor="middle" fill="#94a3b8" font-size="9">@Singleton lives as long as the</text>
  <text x="430" y="200" text-anchor="middle" fill="#94a3b8" font-size="9">component that holds it.</text>
  <text x="430" y="216" text-anchor="middle" fill="#94a3b8" font-size="9">App component → whole app lifetime.</text>
  <text x="430" y="228" text-anchor="middle" fill="#94a3b8" font-size="9">Activity component → per-activity.</text>

  <!-- compile time note -->
  <rect x="326" y="240" width="208" height="50" rx="5" fill="#1e1b4b"/>
  <text x="430" y="257" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="600">Generated at compile time</text>
  <text x="430" y="271" text-anchor="middle" fill="#94a3b8" font-size="9">dagger-compiler writes</text>
  <text x="430" y="284" text-anchor="middle" fill="#94a3b8" font-size="9">DaggerApplicationComponent.java</text>

  <!-- @Inject note -->
  <rect x="326" y="298" width="208" height="44" rx="5" fill="#0f172a"/>
  <text x="430" y="315" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="600">Consumer marks fields with @Inject</text>
  <text x="430" y="329" text-anchor="middle" fill="#94a3b8" font-size="9">Component reads graph and injects them.</text>
  <text x="430" y="341" text-anchor="middle" fill="#94a3b8" font-size="9">No manual new() anywhere.</text>

  <!-- ══ Arrows Component → Consumer ══ -->
  <line x1="550" y1="224" x2="600" y2="224" stroke="#3b82f6" stroke-width="2" marker-end="url(#darr)"/>
  <text x="575" y="218" text-anchor="middle" fill="#3b82f6" font-size="9">injects</text>

  <!-- ══ CONSUMER column ══ -->
  <rect x="600" y="54" width="230" height="340" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="600" y="54" width="230" height="32" rx="8" fill="#1e3a5f"/>
  <rect x="600" y="70"  width="230" height="16" fill="#1e3a5f"/>
  <text x="715" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Consumer</text>
  <text x="715" y="90" text-anchor="middle" fill="#93c5fd" font-size="10">Any class that needs a dependency</text>

  <rect x="616" y="100" width="198" height="56" rx="5" fill="#0f172a"/>
  <text x="715" y="117" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">MyApplication</text>
  <text x="715" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">@Inject lateinit var networkService</text>
  <text x="715" y="145" text-anchor="middle" fill="#94a3b8" font-size="9">@Inject lateinit var databaseService</text>
  <text x="715" y="158" text-anchor="middle" fill="#64748b" font-size="8">lifecycle: whole app</text>

  <rect x="616" y="164" width="198" height="56" rx="5" fill="#0f172a"/>
  <text x="715" y="181" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">MainActivity</text>
  <text x="715" y="195" text-anchor="middle" fill="#94a3b8" font-size="9">@Inject lateinit var viewModel</text>
  <text x="715" y="209" text-anchor="middle" fill="#94a3b8" font-size="9">component.inject(this)</text>
  <text x="715" y="222" text-anchor="middle" fill="#64748b" font-size="8">lifecycle: activity</text>

  <rect x="616" y="228" width="198" height="56" rx="5" fill="#0f172a"/>
  <text x="715" y="245" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">MainViewModel</text>
  <text x="715" y="259" text-anchor="middle" fill="#94a3b8" font-size="9">@Inject lateinit var networkService</text>
  <text x="715" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">@Inject lateinit var databaseService</text>
  <text x="715" y="286" text-anchor="middle" fill="#64748b" font-size="8">consumer of two services</text>

  <rect x="616" y="292" width="198" height="44" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="715" y="310" text-anchor="middle" fill="#64748b" font-size="10">Any other class…</text>
  <text x="715" y="326" text-anchor="middle" fill="#64748b" font-size="9">Consumer can be anywhere in the project</text>

  <!-- ══ Bottom summary ══ -->
  <rect x="30" y="412" width="800" height="68" rx="7" fill="#1e293b"/>
  <text x="430" y="431" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700">How it fits together</text>
  <text x="430" y="449" text-anchor="middle" fill="#64748b" font-size="10">@Module provides objects.  @Component wires modules to consumers and manages scope.  @Inject marks what to receive.</text>
  <text x="430" y="465" text-anchor="middle" fill="#64748b" font-size="10">dagger-compiler reads all annotations at build time and generates the wiring code — no reflection, no runtime cost.</text>
</svg>
