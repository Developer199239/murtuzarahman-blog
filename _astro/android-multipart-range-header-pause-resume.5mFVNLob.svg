<svg viewBox="0 0 860 530" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="530" fill="#0f172a" rx="12"/>
  <text x="430" y="30" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Multipart Requests and Range Header — Pause &amp; Resume Downloads</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- ══ TOP LEFT: Multipart ══ -->
  <rect x="20" y="44" width="390" height="184" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="215" y="64" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Multipart Request — Multiple Content Types in One POST</text>

  <rect x="36" y="72" width="358" height="60" rx="4" fill="#0f172a"/>
  <text x="215" y="88" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="600">A regular POST carries one content type</text>
  <text x="50" y="103" fill="#94a3b8" font-size="8">Content-Type: application/json  →  { "name": "Alice" }</text>
  <text x="215" y="122" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="600">Multipart POST carries mixed content types</text>

  <rect x="36" y="138" width="358" height="80" rx="4" fill="#2d1f3a"/>
  <text x="215" y="153" text-anchor="middle" fill="#94a3b8" font-size="8">--boundary</text>
  <text x="215" y="166" text-anchor="middle" fill="#86efac" font-size="8">Content-Type: text/plain    → "Profile photo upload"</text>
  <text x="215" y="179" text-anchor="middle" fill="#94a3b8" font-size="8">--boundary</text>
  <text x="215" y="192" text-anchor="middle" fill="#60a5fa" font-size="8">Content-Type: image/jpeg    → [binary image bytes]</text>
  <text x="215" y="205" text-anchor="middle" fill="#94a3b8" font-size="8">--boundary--</text>

  <!-- ══ TOP RIGHT: Range Header Intro ══ -->
  <rect x="450" y="44" width="390" height="184" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="645" y="64" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">Range Header — Requesting a Byte Range</text>

  <rect x="466" y="72" width="358" height="50" rx="4" fill="#0f172a"/>
  <text x="480" y="87" fill="#64748b" font-size="8" font-weight="600">Server has a 1024-byte file. Client wants bytes 0–511:</text>
  <text x="480" y="101" fill="#fcd34d" font-size="9">Range: bytes=0-511</text>
  <text x="480" y="115" fill="#94a3b8" font-size="8">Server responds with 206 Partial Content + those bytes only</text>

  <rect x="466" y="130" width="358" height="90" rx="4" fill="#2d1a00"/>
  <!-- Server file bar -->
  <text x="480" y="146" fill="#64748b" font-size="8" font-weight="600">File on server (1024 bytes):</text>
  <rect x="480" y="152" width="328" height="16" rx="2" fill="#374151"/>
  <text x="644" y="164" text-anchor="middle" fill="#94a3b8" font-size="7">0 ─────────────────── 1024</text>
  <!-- First range -->
  <text x="480" y="184" fill="#64748b" font-size="8" font-weight="600">Request 1 — Range: bytes=0-511:</text>
  <rect x="480" y="188" width="164" height="10" rx="2" fill="#22c55e"/>
  <rect x="644" y="188" width="164" height="10" rx="2" fill="#374151"/>
  <text x="562" y="197" text-anchor="middle" fill="#0f172a" font-size="6" font-weight="700">bytes 0–511 ✅</text>
  <text x="726" y="197" text-anchor="middle" fill="#64748b" font-size="6">not yet</text>

  <!-- ══ BOTTOM: Pause and Resume flow ══ -->
  <rect x="20" y="240" width="820" height="274" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="260" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">Pause and Resume — How Range Header Makes It Work</text>

  <!-- Step 1 -->
  <rect x="36" y="268" width="243" height="108" rx="4" fill="#0f172a"/>
  <text x="157" y="284" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">① First Download</text>
  <text x="50" y="300" fill="#94a3b8" font-size="8">Client starts fresh — no local data.</text>
  <text x="50" y="313" fill="#94a3b8" font-size="8">Sends: Range: bytes=0-1024</text>
  <text x="50" y="326" fill="#64748b" font-size="8">(or omits Range — same result)</text>
  <text x="50" y="340" fill="#94a3b8" font-size="8">Server sends from beginning.</text>
  <text x="50" y="353" fill="#94a3b8" font-size="8">Client receives bytes 0–521…</text>
  <text x="50" y="366" fill="#f87171" font-size="8">…then internet disconnects. ✗</text>

  <!-- arrow -->
  <line x1="279" y1="322" x2="297" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="299" y="268" width="243" height="108" rx="4" fill="#0f172a"/>
  <text x="420" y="284" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">② After Reconnect</text>
  <text x="313" y="300" fill="#94a3b8" font-size="8">Client knows bytes 0–521 are saved.</text>
  <text x="313" y="313" fill="#94a3b8" font-size="8">Sends: Range: bytes=521-1024</text>
  <text x="313" y="326" fill="#64748b" font-size="8">(or Range: bytes=521-)</text>
  <text x="313" y="340" fill="#94a3b8" font-size="8">Server reads Range header and</text>
  <text x="313" y="353" fill="#94a3b8" font-size="8">sends only remaining bytes.</text>
  <text x="313" y="366" fill="#86efac" font-size="8">Client appends to partial file.</text>

  <!-- arrow -->
  <line x1="542" y1="322" x2="560" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="562" y="268" width="242" height="108" rx="4" fill="#0f172a"/>
  <text x="683" y="284" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">③ Download Complete</text>
  <text x="576" y="300" fill="#94a3b8" font-size="8">Bytes 0–521 (from attempt 1)</text>
  <text x="576" y="313" fill="#94a3b8" font-size="8">+ bytes 521–1024 (from attempt 2)</text>
  <text x="576" y="326" fill="#86efac" font-size="8">= complete file ✅</text>
  <text x="576" y="342" fill="#64748b" font-size="8">No bytes re-downloaded.</text>
  <text x="576" y="355" fill="#64748b" font-size="8">No wasted bandwidth.</text>
  <text x="576" y="368" fill="#64748b" font-size="8">File integrity maintained.</text>

  <!-- Progress bar visual -->
  <rect x="36" y="384" width="788" height="34" rx="4" fill="#0f172a"/>
  <text x="430" y="399" text-anchor="middle" fill="#64748b" font-size="8" font-weight="700">Download progress bar (client-side view)</text>
  <rect x="36" y="405" width="400" height="10" rx="2" fill="#22c55e"/>
  <rect x="436" y="405" width="388" height="10" rx="2" fill="#374151" stroke="#475569" stroke-width="1"/>
  <text x="236" y="413" text-anchor="middle" fill="#0f172a" font-size="6" font-weight="700">bytes 0–521 already downloaded</text>
  <text x="630" y="413" text-anchor="middle" fill="#64748b" font-size="6">bytes 521–1024 resumed from here</text>

  <!-- Key note -->
  <rect x="36" y="424" width="788" height="80" rx="4" fill="#14532d"/>
  <text x="430" y="442" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">Key Rules for Pause and Resume</text>
  <text x="50" y="458" fill="#94a3b8" font-size="8">① Backend must implement Range header support — the server must respect Range and return 206 Partial Content (not 200)</text>
  <text x="50" y="472" fill="#94a3b8" font-size="8">② Client tracks the last byte received and stores the partial file on disk between sessions</text>
  <text x="50" y="486" fill="#94a3b8" font-size="8">③ Download managers (like OkHttp's DownloadManager or WorkManager-based solutions) handle this automatically</text>
  <text x="50" y="500" fill="#fcd34d" font-size="8">If the server does not support Range headers, resuming is impossible — the download must restart from byte 0</text>
</svg>
