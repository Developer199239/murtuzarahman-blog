<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="520" fill="#0f172a" rx="12"/>
  <text x="430" y="34" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Thread-Safe Singleton: Double-Checked Locking</text>

  <!-- ── Column labels ── -->
  <text x="215" y="58" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">❌  Naive (no sync) — BROKEN</text>
  <text x="645" y="58" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">✅  Double-Checked Locking — SAFE</text>

  <!-- vertical divider -->
  <line x1="430" y1="48" x2="430" y2="490" stroke="#1e293b" stroke-width="2"/>

  <!-- ══════ LEFT SIDE — Broken ══════ -->

  <!-- Thread A label -->
  <rect x="50" y="70" width="140" height="28" rx="5" fill="#7f1d1d"/>
  <text x="120" y="89" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">Thread A (Ajay)</text>
  <!-- Thread B label -->
  <rect x="240" y="70" width="140" height="28" rx="5" fill="#713f12"/>
  <text x="310" y="89" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">Thread B (Divya)</text>

  <!-- step boxes — left -->
  <!-- step 1A -->
  <rect x="50" y="112" width="140" height="34" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="128" text-anchor="middle" fill="#fca5a5" font-size="10">if (instance == null)</text>
  <text x="120" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">→ sees null ✓</text>
  <!-- step 1B same time -->
  <rect x="240" y="112" width="140" height="34" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="128" text-anchor="middle" fill="#fcd34d" font-size="10">if (instance == null)</text>
  <text x="310" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">→ also sees null ✓</text>

  <!-- "at same time" label -->
  <text x="215" y="107" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">both enter at same time</text>

  <!-- arrows down -->
  <line x1="120" y1="146" x2="120" y2="166" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="310" y1="146" x2="310" y2="166" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- step 2 — both create -->
  <rect x="50" y="166" width="140" height="34" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="182" text-anchor="middle" fill="#fca5a5" font-size="10">new DatabaseHelper()</text>
  <text x="120" y="196" text-anchor="middle" fill="#94a3b8" font-size="9">Object #1 created 😱</text>

  <rect x="240" y="166" width="140" height="34" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="182" text-anchor="middle" fill="#fcd34d" font-size="10">new DatabaseHelper()</text>
  <text x="310" y="196" text-anchor="middle" fill="#94a3b8" font-size="9">Object #2 created 😱</text>

  <!-- result box -->
  <rect x="50" y="220" width="330" height="34" rx="5" fill="#450a0a"/>
  <text x="215" y="242" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">Two instances exist — Singleton violated!</text>

  <!-- ══════ RIGHT SIDE — Safe ══════ -->

  <!-- Thread A / B labels -->
  <rect x="460" y="70" width="140" height="28" rx="5" fill="#14532d"/>
  <text x="530" y="89" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">Thread A (Ajay)</text>
  <rect x="650" y="70" width="140" height="28" rx="5" fill="#134e4a"/>
  <text x="720" y="89" text-anchor="middle" fill="#99f6e4" font-size="11" font-weight="700">Thread B (Divya)</text>

  <!-- outer null check — both pass -->
  <rect x="460" y="112" width="140" height="34" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="530" y="128" text-anchor="middle" fill="#86efac" font-size="10">if (instance == null)</text>
  <text x="530" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">→ null, enters block</text>
  <rect x="650" y="112" width="140" height="34" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="128" text-anchor="middle" fill="#86efac" font-size="10">if (instance == null)</text>
  <text x="720" y="141" text-anchor="middle" fill="#94a3b8" font-size="9">→ null, enters block</text>

  <!-- arrows -->
  <line x1="530" y1="146" x2="530" y2="166" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="720" y1="146" x2="720" y2="166" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- synchronized gate -->
  <rect x="460" y="166" width="330" height="36" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="625" y="180" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">synchronized(DatabaseHelper.class)</text>
  <text x="625" y="196" text-anchor="middle" fill="#64748b" font-size="9">Only ONE thread allowed through at a time — acts as a gate</text>

  <!-- Thread A goes first -->
  <line x1="530" y1="202" x2="530" y2="222" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- Thread B waits -->
  <rect x="650" y="202" width="140" height="28" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="720" y="220" text-anchor="middle" fill="#64748b" font-size="10">Thread B waits…</text>

  <!-- inner null check — A passes, creates -->
  <rect x="460" y="222" width="140" height="34" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="530" y="237" text-anchor="middle" fill="#86efac" font-size="10">if (instance == null)</text>
  <text x="530" y="251" text-anchor="middle" fill="#94a3b8" font-size="9">→ still null → create</text>

  <line x1="530" y1="256" x2="530" y2="276" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="460" y="276" width="140" height="34" rx="5" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="530" y="292" text-anchor="middle" fill="#86efac" font-size="10">new DatabaseHelper()</text>
  <text x="530" y="306" text-anchor="middle" fill="#94a3b8" font-size="9">Object #1 created ✅</text>

  <!-- A exits, B enters sync -->
  <line x1="530" y1="310" x2="530" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="460" y="328" width="140" height="28" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="530" y="346" text-anchor="middle" fill="#94a3b8" font-size="10">A exits sync block</text>

  <!-- B enters and checks inner -->
  <line x1="720" y1="230" x2="720" y2="322" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr2)"/>
  <rect x="650" y="322" width="140" height="34" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="337" text-anchor="middle" fill="#86efac" font-size="10">if (instance == null)</text>
  <text x="720" y="351" text-anchor="middle" fill="#94a3b8" font-size="9">→ NOT null → skip ✅</text>

  <!-- result -->
  <rect x="460" y="376" width="330" height="34" rx="5" fill="#14532d"/>
  <text x="625" y="398" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">Only one instance ever created ✅</text>

  <!-- ── bottom code hint ── -->
  <rect x="50" y="430" width="760" height="68" rx="7" fill="#1e293b"/>
  <text x="430" y="449" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700">Why two null checks?</text>
  <text x="430" y="465" text-anchor="middle" fill="#64748b" font-size="10">Outer check: avoids entering synchronized block on every call once instance exists (performance).</text>
  <text x="430" y="481" text-anchor="middle" fill="#64748b" font-size="10">Inner check: guards against the race where two threads both passed the outer check before any instance was created.</text>

  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
