<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="560" fill="#0f172a" rx="12"/>
  <text x="430" y="32" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Debounced Search: debounce → filter → distinctUntilChanged → flatMapLatest</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ══ TOP: The problem ══ -->
  <rect x="30" y="46" width="796" height="50" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="430" y="63" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">❌ The Problem: Typing "AMIT" fires 4 separate network calls</text>
  <text x="430" y="80" text-anchor="middle" fill="#94a3b8" font-size="9">User types A → call ①  |  AM → call ②  |  AMI → call ③  |  AMIT → call ④   — wasteful, slow, drains battery</text>

  <!-- ══ PIPELINE ══ -->
  <!-- Step boxes arranged vertically with arrows -->
  <!-- Source -->
  <rect x="30" y="112" width="796" height="36" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="160" y="126" text-anchor="middle" fill="#64748b" font-size="9">SOURCE</text>
  <text x="430" y="135" text-anchor="middle" fill="#60a5fa" font-size="10">searchView.setOnQueryTextListener → emits on every keystroke:  A → AM → AMI → AMIT</text>

  <line x1="430" y1="148" x2="430" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- debounce -->
  <rect x="30" y="162" width="796" height="46" rx="6" fill="#2d1f3a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="100" y="178" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="700">debounce(300ms)</text>
  <text x="430" y="178" text-anchor="middle" fill="#94a3b8" font-size="9">Starts 300ms timer on each value. If new value arrives before timer expires → discard old, restart timer.</text>
  <text x="430" y="196" text-anchor="middle" fill="#86efac" font-size="9">A discarded ✗ → AM discarded ✗ → AMI discarded ✗ → AMIT (300ms pause) → passes ✅  |  saved 3 calls</text>

  <line x1="430" y1="208" x2="430" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- filter -->
  <rect x="30" y="222" width="796" height="36" rx="6" fill="#1c2a1c" stroke="#22c55e" stroke-width="1"/>
  <text x="100" y="236" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">filter { it.isNotEmpty() }</text>
  <text x="430" y="244" text-anchor="middle" fill="#94a3b8" font-size="9">Returns false for empty string → empty query does not reach network.  If user typed "AMIT" then deleted → empty discarded ✗</text>

  <line x1="430" y1="258" x2="430" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- distinctUntilChanged -->
  <rect x="30" y="272" width="796" height="46" rx="6" fill="#2d1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="130" y="287" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">distinctUntilChanged()</text>
  <text x="430" y="287" text-anchor="middle" fill="#94a3b8" font-size="9">Blocks a value if it is the same as the previous emission. Prevents re-triggering an in-flight call.</text>
  <text x="430" y="305" text-anchor="middle" fill="#fcd34d" font-size="9">User types "AMIT" → waits → types "AMITS" → deletes "S" → "AMIT" again → SAME → discarded ✗ (call already in progress)</text>

  <line x1="430" y1="318" x2="430" y2="332" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- flatMapLatest -->
  <rect x="30" y="332" width="796" height="46" rx="6" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="120" y="347" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">flatMapLatest { query → network(query) }</text>
  <text x="430" y="347" text-anchor="middle" fill="#94a3b8" font-size="9">Cancels previous in-flight network call when a new query arrives. Switches to latest.</text>
  <text x="430" y="365" text-anchor="middle" fill="#86efac" font-size="9">User types "AMI" → call starts → types "AMIT" before call finishes → AMI call cancelled → AMIT call starts ✅</text>

  <line x1="430" y1="378" x2="430" y2="392" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- collect -->
  <rect x="30" y="392" width="796" height="28" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="430" y="411" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">.collect { results → showInRecyclerView(results) }</text>

  <!-- ══ BOTTOM: flatMap comparison ══ -->
  <rect x="30" y="432" width="796" height="116" rx="8" fill="#1e293b"/>
  <text x="430" y="452" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">flatMapLatest vs flatMapConcat vs flatMapMerge</text>

  <rect x="46" y="460" width="234" height="78" rx="4" fill="#0f172a"/>
  <text x="163" y="475" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700">flatMapLatest ✅ for search</text>
  <text x="163" y="488" text-anchor="middle" fill="#94a3b8" font-size="9">Cancels previous call</text>
  <text x="163" y="501" text-anchor="middle" fill="#94a3b8" font-size="9">Always switches to latest query</text>
  <text x="163" y="514" text-anchor="middle" fill="#86efac" font-size="9">No order maintained (not needed)</text>
  <text x="163" y="527" text-anchor="middle" fill="#64748b" font-size="9">Fastest — only useful call runs</text>

  <rect x="298" y="460" width="234" height="78" rx="4" fill="#0f172a"/>
  <text x="415" y="475" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">flatMapConcat ⚠️ order but slow</text>
  <text x="415" y="488" text-anchor="middle" fill="#94a3b8" font-size="9">Does NOT cancel previous call</text>
  <text x="415" y="501" text-anchor="middle" fill="#94a3b8" font-size="9">Maintains order (AMI then AMIT)</text>
  <text x="415" y="514" text-anchor="middle" fill="#fca5a5" font-size="9">Wastes bandwidth on stale calls</text>
  <text x="415" y="527" text-anchor="middle" fill="#64748b" font-size="9">Total time = sum of all calls</text>

  <rect x="550" y="460" width="234" height="78" rx="4" fill="#0f172a"/>
  <text x="667" y="475" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="700">flatMapMerge ❌ causes bugs</text>
  <text x="667" y="488" text-anchor="middle" fill="#94a3b8" font-size="9">Does NOT cancel previous call</text>
  <text x="667" y="501" text-anchor="middle" fill="#94a3b8" font-size="9">Does NOT maintain order</text>
  <text x="667" y="514" text-anchor="middle" fill="#f87171" font-size="9">AMI (15s) finishes AFTER AMIT (2s)</text>
  <text x="667" y="527" text-anchor="middle" fill="#f87171" font-size="9">UI shows stale AMI result last = BUG</text>
</svg>
